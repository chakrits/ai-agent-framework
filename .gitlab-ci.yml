stages:
  - validate
  - test
  - eval

default:
  image: python:3.12-slim

variables:
  PYTHONDONTWRITEBYTECODE: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

validate_framework:
  stage: validate
  script:
    - python3 scripts/doctor.py
    - python3 scripts/sync-adapters.py --check
    - python3 scripts/validate-context-budget.py
    - python3 scripts/validate-contracts.py --check-defaults

unit_tests:
  stage: test
  script:
    - python3 -m unittest discover -s tests -v

agent_evals:
  stage: eval
  script:
    - python3 evals/run_evals.py

# Optional Windows job. Enable by setting CI/CD variable SDLC_ENABLE_WINDOWS_CI=true.
# VERIFY: runner tag and Python availability on your GitLab instance (SaaS Windows runners use PowerShell).
windows_tests:
  stage: test
  tags: [saas-windows-medium-amd64]
  allow_failure: true
  rules:
    - if: $SDLC_ENABLE_WINDOWS_CI == "true"
  before_script:
    - choco install python --version=3.12.7 -y --no-progress
    - $env:Path = "C:\Python312;C:\Python312\Scripts;$env:Path"
  script:
    - py -3 scripts/doctor.py
    - py -3 scripts/sync-adapters.py --check
    - py -3 -m unittest discover -s tests -v
    - '''{"tool_name":"Bash","tool_input":{"command":"git push -f"},"cwd":"."}'' | & scripts\bin\sdlc-hook.cmd pretooluse; if ($LASTEXITCODE -ne 2) { exit 1 }'
