# Filebeat: ship agent trace JSONL to Elasticsearch / OpenSearch.
# STATUS: NOT TESTED against a running Elastic/OpenSearch stack. Check option names against the Filebeat docs for your
# version (filestream input + ndjson parser + timestamp processor). OpenSearch needs a Filebeat OSS build (<= 7.12) or
# use Fluent Bit / the OpenTelemetry Collector instead (see otelcol.yaml).
#
# Load docs/guides/examples/opensearch-index-template.json first (works for both; adjust for data streams if you use them).

filebeat.inputs:
  - type: filestream
    id: sdlc-agent-trace
    paths:
      # Windows: C:\path\to\repo\.sdlc\traces\*\*.jsonl
      - /path/to/repo/.sdlc/traces/*/*.jsonl
    parsers:
      - ndjson:
          target: ""          # put decoded keys at the top level of the event
          add_error_key: true # keep lines that fail to parse, flagged in error.*

processors:
  # `ts` = local time with offset, e.g. 2026-11-21T12:34:56.789+07:00 -> @timestamp (stored as UTC internally).
  - timestamp:
      field: ts
      layouts:
        - "2006-01-02T15:04:05.999Z07:00"
      test:
        - "2026-11-21T12:34:56.789+07:00"

setup.template.enabled: false   # we load our own template
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["https://localhost:9200"]
  index: "sdlc-agent-trace-%{+yyyy.MM.dd}"
  # username: "..." / password: "${ES_PASSWORD}"   # keep credentials out of this file (use the keystore or env)
